[project]
name = "codegen-agent"
version = "0.1.0"
description = "Code generation agent for finance automation — transforms variable Excel inputs into fixed output formats"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.86.0",
    "dspy>=3.1.3",
    "langchain-anthropic>=0.3.0",
    "langgraph>=0.3.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.1.0",
    "pandas>=3.0.1",
    "python-dotenv>=1.2.2",
    "structlog>=25.5.0",
    "tabulate>=0.10.0",
    "pytest>=8.0.0",
    "langchain>=1.2.13",
    "ruff>=0.15.8",
]

[project.scripts]
codegen-agent = "codegen_agent.agent:main"
orchestrator = "orchestrator.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codegen_agent", "orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "W191",  # tab indentation (handled by formatter)
    "E101",  # mixed spaces and tabs (handled by formatter)
]

[dependency-groups]
dev = [
    "ruff>=0.15.7",
]
