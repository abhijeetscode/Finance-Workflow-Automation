[project]
name = "zalos-take-home"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.86.0",
    "dspy>=3.1.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "python-dotenv>=1.2.2",
    "structlog>=25.5.0",
    "tabulate>=0.10.0",
    "pytest>=8.0.0",
 "dspy-ai>=2.5",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "python-docx>=1.1",    
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "W191",  # tab indentation (handled by formatter)
    "E101",  # mixed spaces and tabs (handled by formatter)
]

[dependency-groups]
dev = [
    "ruff>=0.15.7",
]
